; Extended Meta Protocol — пример конфигурации.
; Все значения записываются в одну строку. Файл должен быть сохранён в UTF-8.

[meta]
description = "Краткое описание сервера длиной до 240 символов"
mod = "Deathmatch"
keywords = "cs16,deathmatch,classic"
icon = "https://example.com/server-icon-64x64.png"
map_image = "https://example.com/maps/{map}.jpg"
voice_languages = "ru,en"
interface_languages = "ru,en"

; Публикует в em_commands(_N) только видимые публичные команды AMX Mod X.
; Команда должна быть зарегистрирована с третьим аргументом ADMIN_ALL или 0.
; Команды со значением по умолчанию -1 скрыты AMX Mod X и сюда не попадают.
publish_commands = 0

[links]
; Имена произвольные: результатом будут em_link_site, em_link_vk и т. д.
site = "https://example.com"
vk = "https://vk.com/example"

[custom]
; Пользовательские поля всегда помечаются префиксом em_x_.
; Активные имена перечисляются в em_custom.
season = "summer-2026"
